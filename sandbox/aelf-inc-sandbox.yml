summary: >-
  aelf runs a full public testnet alongside mainnet, with a faucet that hands out free test tokens
  and a browser playground for writing and deploying contracts without installing anything. There
  are no API keys to switch between modes: the "mode" is the node URL you point at. Two caveats
  found by probing — the documented testnet RPC hosts did not answer anonymously on 2026-09-09,
  and the playground host was returning 503.
mode_switching:
  mechanism: endpoint selection
  note: >-
    No test-vs-live key prefixes exist because the API takes no keys. You select an environment by
    choosing a node base URL, and a transaction is bound to a chain by its ChainId.
environments:
- name: mainnet AELF main chain
  base_url: https://aelf-public-node.aelf.io
  chain_id: AELF
  probed: '2026-09-09'
  status: 200
