aid: aelf-inc
name: Aelf
description: 'aelf (styled lowercase by the company, listed on the secondary market as
  "Aelf Inc") is a Singapore-headquartered AI-enhanced, cloud-native layer-1 blockchain
  network founded in 2017. It is written in C# with a modular multi-side-chain architecture,
  parallel transaction execution and built-in cross-chain communication. Its public machine-readable
  surface is the AElf node Web API — an OpenAPI 3.0.1 contract every node serves at
  /swagger/v1/swagger.json and reachable anonymously on the public mainnet nodes — alongside
  89 published protobuf contract definitions (the ACS contract standards, plus the gRPC
  peer and cross-chain services), six first-party chain SDKs, the aelf-command CLI, and a
  first-party agent layer of packaged Agent Skills and a local MCP server.'
url: https://raw.githubusercontent.com/api-evangelist/aelf-inc/refs/heads/main/apis.yml
image: https://docs.aelf.com/img/logo.svg
x-type: company
x-source: harvest:secondary-market
x-tier: profiled
x-tier-reason: enrichment-pipeline
x-identity:
  harvest_listing: https://forgeglobal.com/aelf-inc_stock/
  resolved_to: aelf (aelf.com / github.com/AElfProject), Singapore, founded 2017
  note: >-
    The harvest row came from the Forge Global secondary-market listing
    https://forgeglobal.com/aelf-inc_stock/ ("Aelf", Enterprise Software). That page sits behind a
    Cloudflare interstitial and returned HTTP 403 to every fetch on 2026-09-09, so the mapping to
    aelf was made from the company name and sector rather than by reading the listing itself. No
    other company trading as "Aelf" was found. Every artifact in this repository was harvested from
    aelf.com, docs.aelf.com, the *.aelf.io node hosts and the AElfProject GitHub organization —
    never from the Forge page.
