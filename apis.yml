- name: aelf Agent Gateway API
  description: 'A first-party, self-hosted execution gateway that puts the aelf chain behind typed
    OpenAPI/MCP tools for AI agents: chain and asset queries, EOA/CA wallet operations, an explicit
    prepare -> human approval -> send workflow, exactly-once dispatch, and an audit log. Published
    as source under the AElfProject GitHub organization with an OpenAPI 3.1.0 contract; the operator
    runs it themselves, so its declared server is the loopback default rather than a hosted host.'
  humanURL: https://github.com/AElfProject/aelf-agent-gateway
  image: https://docs.aelf.com/img/logo.svg
  baseURL: http://127.0.0.1:8787
  x-base-note: 'Self-hosted product. The contract declares servers[0].url http://localhost:8787,
    the documented default for a locally or privately run gateway. aelf operates no public instance,
    so there is no production host to record; this is a genuinely local base, not a placeholder.'
  tags:
  - AI Agents
  - Wallets
  - Blockchain
  properties:
  - type: OpenAPI
    url: openapi/aelf-inc-agent-gateway-openapi.yaml
  - type: Overlay
    url: overlays/aelf-inc-agent-gateway-overlay.yaml
  - type: SourceCode
    url: https://github.com/AElfProject/aelf-agent-gateway
