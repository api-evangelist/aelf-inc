apis:
- name: aelf Node Web API
  description: 'The AElf node Web API is the REST surface every aelf node exposes: chain status,
    blocks, block state, transaction pool, transaction submission and results, merkle paths,
    contract file descriptor sets, transaction fee calculation, and peer/network management.
    24 operations across 23 paths, described by an OpenAPI 3.0.1 document the node itself serves
    at /swagger/v1/swagger.json with a Swagger UI at /swagger/index.html. Reads are anonymous;
    the two peer-management writes are documented as requiring HTTP Basic authentication.'
  humanURL: https://docs.aelf.com/tools/web-api/
  image: https://docs.aelf.com/img/logo.svg
  baseURL: https://aelf-public-node.aelf.io
  tags:
  - Blockchain
  - Layer 1
  - Transactions
  - Smart Contracts
