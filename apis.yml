aid: aelf-inc
name: Aelf
description: 'aelf (styled lowercase by the company, listed on the secondary market as
  "Aelf Inc") is a Singapore-headquartered AI-enhanced, cloud-native layer-1 blockchain
  network founded in 2017. It is written in C# with a modular multi-side-chain architecture,
  parallel transaction execution and built-in cross-chain communication. Its public machine-readable
  surface is the AElf node Web API — an OpenAPI 3.0.1 contract every node serves at
  /swagger/v1/swagger.json and reachable anonymously on the public mainnet nodes — alongside
  89 published protobuf contract definitions (the ACS contract standards, plus the gRPC
  peer and cross-chain services), six first-party chain SDKs, the aelf-command CLI, and a
  first-party agent layer of packaged Agent Skills and a local MCP server.'
