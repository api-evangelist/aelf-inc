gaps:
- No code range 20005 is defined; the registry skips it.
- >-
  The OpenAPI attaches the same six response codes (400/401/403/404/500/501) to all 24 operations
  with no per-operation semantics and no error examples.
- >-
  No published documentation page lists these codes. A consumer who does not read the C# source
  cannot enumerate them.
