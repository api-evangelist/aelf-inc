summary: >-
  aelf publishes a numeric error-code registry for the node Web API in its own source
  (Error.cs, the 200xx family) and returns it inside the ABP RemoteServiceErrorResponse envelope.
  It is a genuine registry — thirteen codes with fixed messages — but it is discoverable only by
  reading C# source: the OpenAPI declares 400/401/403/404/500/501 on every operation without ever
  naming a code, and the API reference pages do not list them either.
envelope:
  shape: '{"Error": {"Code", "Message", "Details", "Data", "ValidationErrors"}}'
  origin: ABP Framework RemoteServiceErrorResponse (Volo.Abp.Http.RemoteServiceErrorResponse)
  schema_ref: '#/components/schemas/Volo.Abp.Http.RemoteServiceErrorResponse'
  content_type: application/json
  code_field: Error.Code
  code_type: string-encoded integer (null for framework model-validation failures)
  observed_example:
    request: GET https://aelf-public-node.aelf.io/api/blockChain/block?blockHash=zzz
    status: 403
    body: '{"Error":{"Code":"20003","Message":"Invalid block hash format","Details":null,"Data":{},"ValidationErrors":null}}'
    note: >-
      OBSERVED 2026-09-09 and worth reading twice: a malformed block hash — a pure input-format
      error — comes back as HTTP 403 Forbidden, not 400. The same is true of a malformed
      transaction id (403, code 20004). An agent that routes on status codes will read these as
      authorization failures and may go looking for credentials this anonymous API never wanted.
      The status code is not a reliable signal here; the Error.Code field is.
  validation_example:
    request: GET https://aelf-public-node.aelf.io/api/blockChain/blockByHeight?blockHeight=abc
    status: 400
    body: '{"Error":{"Code":null,"Message":"Your request is not valid!","Details":"...","ValidationErrors":[{"Message":"The value ''abc'' is not valid.","Members":["blockHeight"]}]}}'
