openapi: 3.2.0
info:
  title: aelf Agent Gateway Admin API
  version: 0.1.0
  description: Secure aelf execution gateway exposed to NyxID as typed MCP tools. Agent-facing operations never return private keys, mnemonics, raw keystores, wallet passwords, Authorization headers, or NyxID delegation tokens.
servers:
- url: http://localhost:8787
security:
- GatewayBearerAuth: []
tags:
- name: Admin
paths:
  /admin/audit-events:
    get:
      tags:
      - Admin
      operationId: listAelfAuditEvents
      summary: List redacted audit events. Admin-only
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Redacted audit events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventPublic'
components:
  schemas:
    AuditEventPublic:
      type: object
      required:
      - id
      - traceId
      - operationId
      - status
      - createdAt
      properties:
        id:
          type: string
        traceId:
          type: string
        operationId:
          type: string
        walletId:
          type: string
        chainId:
          $ref: '#/components/schemas/ChainId'
        txId:
          type: string
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        status:
          type: string
        errorCode:
          type: string
        createdAt:
          type: string
          format: date-time
    RiskLevel:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      - FORBIDDEN
    ChainId:
      type: string
      enum:
      - AELF
      - tDVV
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
