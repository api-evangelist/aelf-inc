openapi: 3.2.0
info:
  title: aelf Agent Gateway Explorer API
  version: 0.1.0
  description: Secure aelf execution gateway exposed to NyxID as typed MCP tools. Agent-facing operations never return private keys, mnemonics, raw keystores, wallet passwords, Authorization headers, or NyxID delegation tokens.
servers:
- url: http://localhost:8787
security:
- GatewayBearerAuth: []
tags:
- name: Explorer
paths:
  /explorer/search:
    get:
      tags:
      - Explorer
      operationId: searchAelfscan
      summary: Search AelfScan read-only data
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: chainId
        in: query
        schema:
          $ref: '#/components/schemas/ChainId'
      responses:
        '200':
          description: Explorer search result.
  /explorer/address/{address}:
    get:
      tags:
      - Explorer
      operationId: getAelfscanAddressDetail
      summary: Get read-only AelfScan address detail
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
      - name: chainId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ChainId'
      responses:
        '200':
          description: Address detail from explorer.
  /explorer/transactions/{txId}:
    get:
      tags:
      - Explorer
      operationId: getAelfscanTransactionDetail
      summary: Get read-only AelfScan transaction detail
      parameters:
      - name: txId
        in: path
        required: true
        schema:
          type: string
      - name: chainId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ChainId'
      responses:
        '200':
          description: Transaction detail from explorer.
components:
  schemas:
    ChainId:
      type: string
      enum:
      - AELF
      - tDVV
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
