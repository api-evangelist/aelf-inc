openapi: 3.2.0
info:
  title: aelf Agent Gateway Transactions API
  version: 0.1.0
  description: Secure aelf execution gateway exposed to NyxID as typed MCP tools. Agent-facing operations never return private keys, mnemonics, raw keystores, wallet passwords, Authorization headers, or NyxID delegation tokens.
servers:
- url: http://localhost:8787
security:
- GatewayBearerAuth: []
tags:
- name: Transactions
paths:
  /transactions/{txId}:
    get:
      tags:
      - Transactions
      operationId: getAelfTransactionResult
      summary: Get aelf transaction result by transaction id
      parameters:
      - name: txId
        in: path
        required: true
        schema:
          type: string
      - name: chainId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ChainId'
      responses:
        '200':
          description: Transaction result.
components:
  schemas:
    ChainId:
      type: string
      enum:
      - AELF
      - tDVV
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
