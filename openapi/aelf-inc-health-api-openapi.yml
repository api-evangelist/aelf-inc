openapi: 3.2.0
info:
  title: aelf Agent Gateway Health API
  version: 0.1.0
  description: Secure aelf execution gateway exposed to NyxID as typed MCP tools. Agent-facing operations never return private keys, mnemonics, raw keystores, wallet passwords, Authorization headers, or NyxID delegation tokens.
servers:
- url: http://localhost:8787
security:
- GatewayBearerAuth: []
tags:
- name: Health
paths:
  /health:
    get:
      tags:
      - Health
      operationId: getAelfGatewayHealth
      summary: Check aelf agent gateway health
      responses:
        '200':
          description: Gateway health.
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - ok
      - traceId
      - error
      properties:
        ok:
          type: boolean
          const: false
        traceId:
          type: string
        error:
          type: object
          required:
          - code
          - message
          - retriable
          properties:
            code:
              type: string
            message:
              type: string
            retriable:
              type: boolean
            details:
              type: object
              additionalProperties: true
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
