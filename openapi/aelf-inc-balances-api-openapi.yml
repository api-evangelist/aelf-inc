openapi: 3.2.0
info:
  title: aelf Agent Gateway Balances API
  version: 0.1.0
  description: Secure aelf execution gateway exposed to NyxID as typed MCP tools. Agent-facing operations never return private keys, mnemonics, raw keystores, wallet passwords, Authorization headers, or NyxID delegation tokens.
servers:
- url: http://localhost:8787
security:
- GatewayBearerAuth: []
tags:
- name: Balances
paths:
  /balances:
    get:
      tags:
      - Balances
      operationId: getAelfBalance
      summary: Get token balance for a wallet or address
      parameters:
      - name: walletId
        in: query
        schema:
          type: string
      - name: address
        in: query
        schema:
          type: string
      - name: symbol
        in: query
        schema:
          type: string
          default: ELF
      - name: chainId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ChainId'
      responses:
        '200':
          description: Balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
components:
  schemas:
    Balance:
      type: object
      required:
      - chainId
      - address
      - symbol
      - amount
      - rawAmount
      - decimals
      properties:
        chainId:
          $ref: '#/components/schemas/ChainId'
        address:
          type: string
        symbol:
          type: string
        amount:
          type: string
        rawAmount:
          type: string
        decimals:
          type: integer
    ChainId:
      type: string
      enum:
      - AELF
      - tDVV
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
