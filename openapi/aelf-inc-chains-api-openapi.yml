openapi: 3.2.0
info:
  title: aelf Agent Gateway Chains API
  version: 0.1.0
  description: Secure aelf execution gateway exposed to NyxID as typed MCP tools. Agent-facing operations never return private keys, mnemonics, raw keystores, wallet passwords, Authorization headers, or NyxID delegation tokens.
servers:
- url: http://localhost:8787
security:
- GatewayBearerAuth: []
tags:
- name: Chains
paths:
  /chains:
    get:
      tags:
      - Chains
      operationId: getAelfChains
      summary: List supported aelf chains
      responses:
        '200':
          description: Supported chains.
components:
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
