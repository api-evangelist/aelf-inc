openapi: 3.2.0
info:
  title: aelf Agent Gateway Wallets API
  version: 0.1.0
  description: Secure aelf execution gateway exposed to NyxID as typed MCP tools. Agent-facing operations never return private keys, mnemonics, raw keystores, wallet passwords, Authorization headers, or NyxID delegation tokens.
servers:
- url: http://localhost:8787
security:
- GatewayBearerAuth: []
tags:
- name: Wallets
paths:
  /wallets:
    post:
      tags:
      - Wallets
      operationId: createAelfWallet
      summary: Create encrypted local aelf wallet and return public metadata only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletType:
                  $ref: '#/components/schemas/WalletType'
                  default: EOA
                label:
                  type: string
                chainIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChainId'
      responses:
        '200':
          description: Public wallet metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPublic'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags:
      - Wallets
      operationId: listAelfWallets
      summary: List public metadata for local aelf wallets
      responses:
        '200':
          description: Wallet list.
  /wallets/{walletId}:
    get:
      tags:
      - Wallets
      operationId: getAelfWallet
      summary: Get public metadata for one wallet
      parameters:
      - name: walletId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Wallet public metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPublic'
components:
  schemas:
    WalletPublic:
      type: object
      required:
      - walletId
      - walletType
      - baseAddress
      - addresses
      - secretExported
      properties:
        walletId:
          type: string
        walletType:
          $ref: '#/components/schemas/WalletType'
        label:
          type: string
        baseAddress:
          type: string
        addresses:
          type: object
          additionalProperties:
            type: string
        active:
          type: boolean
        secretExported:
          type: boolean
          const: false
    WalletType:
      type: string
      enum:
      - EOA
      - CA
    ErrorEnvelope:
      type: object
      required:
      - ok
      - traceId
      - error
      properties:
        ok:
          type: boolean
          const: false
        traceId:
          type: string
        error:
          type: object
          required:
          - code
          - message
          - retriable
          properties:
            code:
              type: string
            message:
              type: string
            retriable:
              type: boolean
            details:
              type: object
              additionalProperties: true
    ChainId:
      type: string
      enum:
      - AELF
      - tDVV
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
