summary: >-
  aelf versions the node, not the API. There are tagged, dated node releases going back years and
  the current one (v1.12.1, 2026-09-02) is recent, but there is no API version policy, no
  deprecation policy, no Sunset/Deprecation header practice, no published SLA and no status page.
  Nothing in the OpenAPI is marked deprecated.
