summary: >-
  The model is a blockchain, so it is a chain of blocks containing transactions, each of which
  produces one result carrying log events. What makes it aelf-specific is the side-chain axis:
  every entity is scoped by ChainId, and MerklePath exists so a transaction on one chain can be
  proven to another. Almost every relationship is expressed as a hex-string identifier rather than
  an embedded object or a $ref, so the graph below is largely inferred from field names and
  semantics, not from the spec's own links.
identifier_conventions:
- entity: Block
  id_field: BlockHash
  format: 64-character hex string
  error_on_bad_format: '20003 InvalidBlockHash'
- entity: Transaction
  id_field: TransactionId
  format: 64-character hex string
  error_on_bad_format: '20004 InvalidTransactionId'
- entity: Account / Contract
  id_field: Address
  format: base58 aelf address
  error_on_bad_format: '20002 InvalidAddress / 20010 InvalidContractAddress'
- entity: Chain
  id_field: ChainId
  format: short string, e.g. AELF (main chain), tDVV / tDVW (side chains)
