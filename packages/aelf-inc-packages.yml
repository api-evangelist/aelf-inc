source: >-
  Registry metadata endpoints (registry.npmjs.org, pypi.org/pypi, api.nuget.org,
  proxy.golang.org, search.maven.org, repo.packagist.org) plus the provider's own SDK index at
  https://docs.aelf.com/tools/chain-sdk/ and the AElfProject GitHub organization.
summary:
  first_party_sdk_count: 6
  first_party_other_count: 4
  third_party_package_count: 0
  note: >-
    aelf publishes six first-party chain SDKs — one per language listed on its own
    /tools/chain-sdk/ index — and every one resolves to a package in that language's public
    registry, all sourced from repositories in the AElfProject GitHub organization.
    CURRENCY IS THE FINDING: four of the six (Python, C#, Java, PHP) were last published on
    2023-03-09/10 at version 1.2.3 and have not been released against any node version since
    AELF v1.4.1. Only the JavaScript SDK (2025-09-23) and the Go SDK (2024-09-14) have shipped
    in the last two years, while the node itself released v1.12.1 on 2026-09-02 — including the
    v1.12.0 MultiTransaction type and the transactionResultWithBVP endpoint that the 2023 SDKs
    predate. The agent-layer packages are the actively maintained ones.
