source: >-
  mcp/aelf-inc-node-skill-tools.json (the provider's own openclaw.json tool manifest, 11 tools)
  bound to openapi/aelf-inc-node-web-api-openapi.json (AElf API, OpenAPI 3.0.1, 24 operations).
summary: >-
  The aelf node skill is a thin agent wrapper over the node Web API: nine of its eleven tools map
  onto a single REST operation each, and the two that do not are local node-registry conveniences
  with no chain-side equivalent. The important asymmetry runs the other way — 16 of the 24 REST
  operations have no tool at all, including every raw/multi-transaction path, the merkle-path
  endpoint used for cross-chain verification, and the whole /api/net surface.
surfaces:
- kind: openapi
  name: aelf Node Web API
  file: openapi/aelf-inc-node-web-api-openapi.json
  endpoint: https://aelf-public-node.aelf.io
  gated: false
- kind: mcp
  name: aelf-node-skill
  file: mcp/aelf-inc-node-skill-tools.json
  transport: stdio
  endpoint: null
  gated: false
  note: >-
    Local stdio server, no URL. Its published inputSchemas are empty permissive objects, so each
    tool's REAL input contract is the one it inherits from the REST operation named below.
- kind: openapi
  name: aelf Agent Gateway
  file: openapi/aelf-inc-agent-gateway-openapi.yaml
  endpoint: http://127.0.0.1:8787
  gated: false
  note: >-
    A second, separate agent surface. The gateway exposes its own 15 operations to agents as typed
    tools through NyxID rather than through the node skill, so it is not crosswalked tool-by-tool
    here; its operationIds are declared in its own contract.
identifier_note: >-
  The node Web API spec declares NO operationId on any of its 24 operations, so `rest:` rows below
  carry `METHOD /path` instead. That is a defect in the published contract, not in this crosswalk:
  an agent cannot address these operations by a stable name.
