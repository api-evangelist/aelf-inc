commands:
- name: create
  group: wallet
  description: Create a new account, with a configurable cipher algorithm.
- name: load
  group: wallet
  description: Load an account from a private key or mnemonic.
- name: wallet
  group: wallet
  description: Show wallet details — private key, address, public key and mnemonic.
- name: config
  group: config
  description: Get, set, delete or list configuration values in .aelfrc.
- name: proposal
  group: governance
  description: Create a proposal through the Parliament, Referendum or Association contract.
- name: send
  group: transactions
