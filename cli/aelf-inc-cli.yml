name: aelf-command
description: >-
  First-party Node.js CLI for aelf. Creates and loads accounts, reads chain state, calls read-only
  contract methods, sends transactions, decodes transaction event logs, creates governance
  proposals, and runs an interactive console against any node endpoint.
docs: https://docs.aelf.com/tools/aelf-cli/
